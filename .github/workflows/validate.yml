name: Validate RectShield

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: XML + C# checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parsers
        run: pip install --quiet tree-sitter tree-sitter-c-sharp

      - name: Validate XML defs
        run: python3 Tests/validate_xml.py

      - name: Parse all C# sources
        run: python3 Tests/parse_csharp.py

      - name: Check mod structure
        run: python3 Tests/check_structure.py

  # Optionaler Game-Build. Wird nur manuell ausgefuehrt, da die RimWorld-DLLs
  # aus lizenzrechtlichen Gruenden nicht im Repository liegen duerfen.
  game-build:
    name: Build against game assemblies
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build 1.7 if assemblies are present
        shell: pwsh
        env:
          RW_MANAGED: ${{ secrets.RW17_MANAGED }}
        run: |
          if (-not $env:RW_MANAGED) {
            Write-Host "::warning::Kein RW17_MANAGED Secret gesetzt - Game-Build uebersprungen."
            exit 0
          }
          dotnet build Source/RectShield.1.7.csproj -c Release -p:ManagedPath="$env:RW_MANAGED"
